<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DumpBeacon Web Preview</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css" rel="stylesheet" />
    <style>
        body {
            background-color: #111827; /* Dark theme as requested */
            color: #f3f4f6;
        }
        .drop-zone {
            transition: all 0.3s ease;
        }
        .drop-zone.dragover {
            border-color: #3b82f6;
            background-color: rgba(59, 130, 246, 0.1);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col p-8 md:p-12 font-sans">
    <header class="mb-10 text-center md:text-left">
        <h1 class="text-4xl md:text-5xl font-extrabold bg-clip-text text-transparent bg-gradient-to-r from-blue-400 to-emerald-400 mb-2">DumpBeacon Web Preview</h1>
        <p class="text-gray-400 text-lg">Extract and visualize schema structures instantly from your .sql files.</p>
    </header>

    <main class="flex-grow flex flex-col gap-8 max-w-7xl mx-auto w-full">
        <!-- Drag and Drop Zone -->
        <div id="drop-zone" class="drop-zone w-full p-16 border-2 border-dashed border-gray-600 rounded-2xl flex flex-col items-center justify-center cursor-pointer hover:border-gray-400 bg-gray-800/40 shadow-sm">
            <svg class="w-20 h-20 text-gray-400 mb-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"></path>
            </svg>
            <p class="text-2xl text-gray-200 font-medium text-center">Drag and drop your .sql file here</p>
            <p class="text-base text-gray-500 mt-2">or click to browse from your computer</p>
            <input type="file" id="file-input" class="hidden" accept=".sql,.txt" />
        </div>

        <div id="loading" class="hidden text-center py-12">
            <div class="inline-block animate-spin rounded-full h-10 w-10 border-b-2 border-blue-400 mb-4"></div>
            <p class="text-gray-400 text-lg" id="loading-text">Parsing schema structure...</p>
        </div>

        <!-- Results Display -->
        <div id="results-container" class="hidden grid grid-cols-1 lg:grid-cols-3 gap-8 opacity-0 transition-opacity duration-700 ease-in-out">
            <!-- Left Column: Metrics -->
            <div class="lg:col-span-1 flex flex-col gap-6">
                <div class="bg-gray-800 rounded-2xl p-8 border border-gray-700 shadow-xl relative overflow-hidden group">
                    <div class="absolute inset-0 bg-blue-500/5 group-hover:bg-blue-500/10 transition-colors duration-300"></div>
                    <h2 class="text-gray-400 text-sm font-semibold uppercase tracking-widest mb-3 relative z-10">Total Tables Found</h2>
                    <p id="total-tables" class="text-5xl font-black text-blue-400 relative z-10">0</p>
                </div>
                
                <div class="bg-gray-800 rounded-2xl p-8 border border-gray-700 shadow-xl relative overflow-hidden group">
                    <div class="absolute inset-0 bg-emerald-500/5 group-hover:bg-emerald-500/10 transition-colors duration-300"></div>
                    <h2 class="text-gray-400 text-sm font-semibold uppercase tracking-widest mb-3 relative z-10">Total Columns Found</h2>
                    <p id="total-columns" class="text-5xl font-black text-emerald-400 relative z-10">0</p>
                </div>

                <div class="bg-gray-800/80 rounded-2xl p-6 border border-gray-700 shadow-lg mt-auto">
                     <h2 class="text-gray-400 text-xs font-semibold uppercase tracking-wider mb-2">File Information</h2>
                     <p id="file-name" class="text-gray-200 truncate font-mono text-sm"></p>
                     <p id="file-size" class="text-gray-500 text-xs mt-1"></p>
                </div>
            </div>

            <!-- Right Column: JSON Display -->
            <div class="lg:col-span-2 bg-gray-800 rounded-2xl border border-gray-700 shadow-2xl flex flex-col overflow-hidden" style="min-height: 500px; max-height: 700px;">
                <div class="px-6 py-4 border-b border-gray-700 bg-gray-900/50 flex justify-between items-center">
                    <h2 class="text-sm font-semibold text-gray-300 tracking-wide">Extracted Schema Structure</h2>
                    <div class="flex gap-2">
                        <div class="w-3.5 h-3.5 rounded-full bg-red-500/80"></div>
                        <div class="w-3.5 h-3.5 rounded-full bg-yellow-500/80"></div>
                        <div class="w-3.5 h-3.5 rounded-full bg-green-500/80"></div>
                    </div>
                </div>
                <div class="p-4 overflow-auto flex-grow bg-[#1d1f21] custom-scrollbar">
                    <pre><code id="json-output" class="language-json text-sm"></code></pre>
                </div>
            </div>
        </div>
    </main>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-json.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
