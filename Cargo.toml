[package]
name = "dump_beacon"
version = "0.1.0"
edition = "2021"
build = "build.rs"
default-run = "dump_beacon"

[lib]
name = "dump_beacon"
path = "src/lib.rs"

[[bin]]
name = "dump_beacon"
path = "src/main.rs"

[[bin]]
name = "dump_beacon_cli"
path = "src/bin/cli.rs"

[dependencies]
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["fs", "io-util", "macros", "rt-multi-thread"] }
tauri = { version = "2.0", features = [] }
rfd = "0.17.2"
clap = { version = "4.5", features = ["derive"] }
tokio-util = "0.7"
chrono = "0.4.44"
tauri-plugin-shell = "2.3.5"

[build-dependencies]
tauri-build = { version = "2.0", features = [] }
